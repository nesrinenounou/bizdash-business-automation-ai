services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizdash
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: bizdash
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizdash"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://bizdash:${DB_PASSWORD}@db:5432/bizdash
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/new-order
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /srv/uploads
    volumes: [uploads:/srv/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]
  n8n:
    image: n8nio/n8n:1.76.1
    restart: unless-stopped
    ports: ["127.0.0.1:5678:5678"]   # local only; publish through a reverse proxy with auth
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?set N8N_PASSWORD in .env}
    volumes: [n8ndata:/home/node/.n8n]
volumes:
  uploads:
  pgdata:
  n8ndata:
